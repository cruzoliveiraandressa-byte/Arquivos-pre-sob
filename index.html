
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arquivo Sobrenatural e Preternatural</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #e6e6e6;
            line-height: 1.7;
        }

        header {
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;

            background:
                radial-gradient(circle, rgba(100, 0, 150, 0.25), transparent 50%),
                linear-gradient(135deg, #050505, #17051f, #050505);

            border-bottom: 2px solid #7b2cbf;
        }

        header h1 {
            font-size: 52px;
            color: #c77dff;
            text-shadow: 0 0 20px #7b2cbf;
            margin-bottom: 15px;
        }

        header p {
            font-size: 20px;
            color: #aaa;
            max-width: 700px;
        }

        nav {
            background: #0d0d0d;
            padding: 18px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #292929;
        }

        nav a {
            color: #c77dff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: white;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        section {
            background: #0e0e0e;
            margin-bottom: 30px;
            padding: 35px;
            border: 1px solid #252525;
            border-left: 4px solid #7b2cbf;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(123, 44, 191, 0.08);
        }

        h2 {
            color: #c77dff;
            margin-bottom: 18px;
            font-size: 30px;
        }

        p {
            color: #ccc;
            margin-bottom: 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: #161616;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #292929;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
            border-color: #9d4edd;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.2);
        }

        .card h3 {
            color: #bb86fc;
            margin-bottom: 10px;
        }

        .arquivo {
            background: #080808;
            border: 1px dashed #6930c3;
            padding: 25px;
            margin-top: 20px;
            border-radius: 8px;
        }

        .arquivo strong {
            color: #d8b4fe;
        }

        .aviso {
            color: #ffcc80;
            background: #1c1408;
            border-left: 4px solid #ff9800;
            padding: 20px;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            padding: 35px 20px;
            background: #030303;
            border-top: 1px solid #222;
            color: #777;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 36px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
            }

            section {
                padding: 25px;
            }
        }
    </style>
</head>

<body>


    <body>
        <h3> Ao longo da historia as pessoas só sabiam que o sobrenatural estava relacionado a</h3>
        <h3> coisas que os humanos não são capazes de fazer, ou seja, atividades divinas.</h3>



        
    </body>
